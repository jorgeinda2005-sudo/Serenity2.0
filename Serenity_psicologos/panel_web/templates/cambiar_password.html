<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | Serenity</title>

    <link rel="icon" href="{{ url_for('static', filename='img/serenity.jpg') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/cambiar_password.css') }}">
</head>

<body>

<header class="main-header border-bottom">
    <div class="container-fluid d-flex justify-content-between align-items-center p-3">

        <div class="d-flex align-items-center">
            <a href="{{ url_for('dashboard') }}">
                <img src="{{ url_for('static', filename='img/serenity.jpg') }}" alt="Logo" style="max-height: 40px;">
            </a>
            <h1 class="h5 mb-0 fw-bold text-primary ms-2">Serenity</h1>
        </div>

        <div>
            <span class="text-muted small">Usuario: {{ user }}</span>
        </div>
    </div>
</header>

<main class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="h4 mb-4 text-center">
                        <i class="fas fa-key text-primary me-2"></i>
                        Cambiar contraseña
                    </h2>

                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Contraseña actual</label>
                            <input type="password" name="actual" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" name="nueva" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirmar nueva contraseña</label>
                            <input type="password" name="confirmar" class="form-control" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Actualizar contraseña
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<script src="https://kit.fontawesome.com/a2d9d5a52b.js" crossorigin="anonymous"></script>

</body>
</html>
