<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenity | Cambiar contraseña</title>
  <link rel="icon" href="{{ url_for('static', filename='img/serenity.jpg') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/serenity.css') }}">
</head><style>
  body { background: #f0f2f5; font-family: Arial, sans-serif; }

  .main-header {
    background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.08);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #007bff, #0056b3);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px;
  }
  .metric-card {
    background: white; border-radius: 12px; padding: 24px; text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.06); transition: transform 0.2s;
  }
  .metric-card:hover { transform: translateY(-4px); }
  .metric-num { font-size: 42px; font-weight: 700; }
  .data-table thead th { font-weight: 600; }
  .table-hover tbody tr:hover { background: #f8f9ff; cursor: pointer; }
  .chat-user {
    background: #007bff; color: white; border-radius: 18px 18px 4px 18px;
    padding: 10px 16px; max-width: 70%; margin-left: auto; margin-bottom: 8px; font-size: 14px;
  }
  .chat-bot {
    background: #f1f3f4; color: #333; border-radius: 18px 18px 18px 4px;
    padding: 10px 16px; max-width: 70%; margin-bottom: 8px; font-size: 14px;
  }
  .chat-time { font-size: 11px; color: #aaa; margin-bottom: 4px; }
  .login-bg {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: white; border-radius: 20px; padding: 40px;
    width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .alert-row {
    border-left: 4px solid #dc3545; padding: 12px 16px; background: #fff;
    border-radius: 0 8px 8px 0; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .alert-row.medio { border-left-color: #fd7e14; }
  .data-card {
    background: #fff; border-left: 4px solid #007bff;
    padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 10px; font-size: 14px;
  }
</style>
<body>
  <div class="main-header">
    <div class="logo-area">
      <img src="{{ url_for('static', filename='img/serenity.jpg') }}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;">
      <span class="fw-bold text-primary fs-5">Serenity</span>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <span class="text-muted small"><i class="fas fa-user-circle me-1"></i>{{ user }}</span>
      <a href="{{ url_for('cambiar_password') }}" class="btn btn-sm btn-outline-primary">
        <i class="fas fa-key me-1"></i> Contraseña
      </a>
      <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-danger">
        <i class="fas fa-sign-out-alt me-1"></i> Salir
      </a>
    </div>
  </div>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow-sm">
        <div class="text-center mb-4">
          <i class="fas fa-key fa-3x text-primary mb-3"></i>
          <h5 class="fw-bold">Cambiar contraseña</h5>
        </div>
        <div class="alert alert-info small">
          <i class="fas fa-info-circle me-1"></i>
          Mínimo 8 caracteres, una mayúscula, un número y un símbolo (!@#$%...)
        </div>

        {% if error %}
        <div class="alert alert-danger">
          <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST">
          {% if not session.get('primer_acceso') %}
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="fas fa-lock me-1 text-primary"></i> Contraseña actual
            </label>
            <input type="password" name="actual" class="form-control" placeholder="Tu contraseña actual" required>
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="fas fa-key me-1 text-primary"></i> Nueva contraseña
            </label>
            <input type="password" name="nueva" class="form-control" placeholder="Ej. Serenity2026!" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">
              <i class="fas fa-check-circle me-1 text-primary"></i> Confirmar contraseña
            </label>
            <input type="password" name="confirmar" class="form-control" placeholder="Repite la nueva contraseña" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">
            <i class="fas fa-save me-2"></i> Actualizar contraseña
          </button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100">
            <i class="fas fa-times me-2"></i> Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
