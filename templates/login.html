<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenity | Ingreso</title>
  <link rel="icon" href="{{ url_for('static', filename='img/serenity.jpg') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/serenity.css') }}">
</head><style>
  body { background: #f0f2f5; font-family: Arial, sans-serif; }

  .main-header {
    background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.08);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #007bff, #0056b3);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px;
  }
  .metric-card {
    background: white; border-radius: 12px; padding: 24px; text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.06); transition: transform 0.2s;
  }
  .metric-card:hover { transform: translateY(-4px); }
  .metric-num { font-size: 42px; font-weight: 700; }
  .data-table thead th { font-weight: 600; }
  .table-hover tbody tr:hover { background: #f8f9ff; cursor: pointer; }
  .chat-user {
    background: #007bff; color: white; border-radius: 18px 18px 4px 18px;
    padding: 10px 16px; max-width: 70%; margin-left: auto; margin-bottom: 8px; font-size: 14px;
  }
  .chat-bot {
    background: #f1f3f4; color: #333; border-radius: 18px 18px 18px 4px;
    padding: 10px 16px; max-width: 70%; margin-bottom: 8px; font-size: 14px;
  }
  .chat-time { font-size: 11px; color: #aaa; margin-bottom: 4px; }
  .login-bg {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: white; border-radius: 20px; padding: 40px;
    width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .alert-row {
    border-left: 4px solid #dc3545; padding: 12px 16px; background: #fff;
    border-radius: 0 8px 8px 0; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .alert-row.medio { border-left-color: #fd7e14; }
  .data-card {
    background: #fff; border-left: 4px solid #007bff;
    padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 10px; font-size: 14px;
  }
</style>
<body>
<div class="login-bg">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/serenity.jpg') }}"
           style="width:60px;height:60px;border-radius:50%;object-fit:cover;" class="mb-3">
      <h3 class="fw-bold text-primary">Serenity</h3>
      <p class="text-muted">Ingreso Psicólogos UNACAR</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">
      <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form action="/auth" method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">
          <i class="fas fa-user me-1 text-primary"></i> Usuario
        </label>
        <input name="user" class="form-control form-control-lg" placeholder="Tu usuario institucional" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">
          <i class="fas fa-lock me-1 text-primary"></i> Contraseña
        </label>
        <input name="pass" type="password" class="form-control form-control-lg" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
        <i class="fas fa-sign-in-alt me-2"></i> Ingresar
      </button>
    </form>
    <div class="text-center">
      <small><a href="#" class="text-muted">¿Olvidaste tu contraseña?</a></small>
    </div>
    <hr>
    <div class="text-center text-muted small">
      <i class="fas fa-lock me-1"></i> Sesión segura · Expira en 1 hora
    </div>
  </div>
</div>
</body>
</html>
